[package]
name = "taskbar-groups"
version = "0.1.0"
edition = "2021"
description = "A Rust reimplementation of Taskbar Groups for Windows"
license = "MIT"
repository = "https://github.com/kaiiuen/taskbar-groups"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
